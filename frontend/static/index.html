<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Coach</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #f97316;
    --accent-gradient: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
    --bg-dark: #0b0f19;
    --card-bg: #1e293b;
    --card-border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --user-bubble: linear-gradient(135deg, #f97316 0%, #dc2626 100%);
    --agent-bubble: #1e293b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header Navbar */
  header {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    background: var(--accent-gradient);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
  }
  .brand-title {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.825rem;
    color: var(--text-secondary);
    background: rgba(30, 41, 59, 0.6);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    border: 1px solid var(--card-border);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
  }

  /* Chat Output Container */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }

  /* Welcome Banner */
  .welcome-card {
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    margin-bottom: 0.5rem;
    animation: fadeIn 0.4s ease-out;
  }
  .welcome-card .icon-wrapper {
    width: 48px;
    height: 48px;
    background: rgba(249, 115, 22, 0.15);
    color: var(--accent);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.75rem;
  }
  .welcome-card h2 { margin: 0 0 0.35rem; font-size: 1.25rem; font-weight: 600; }
  .welcome-card p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4; }

  /* Messages & Dialogue Bubbles */
  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    animation: slideUp 0.3s ease-out;
  }
  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .msg.agent .avatar {
    background: rgba(249, 115, 22, 0.2);
    color: var(--accent);
    border: 1px solid rgba(249, 115, 22, 0.3);
  }
  .msg.user .avatar {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }

  .bubble-container {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .bubble {
    padding: 0.85rem 1.1rem;
    border-radius: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    word-break: break-word;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }
  .msg.agent .bubble {
    background: var(--agent-bubble);
    color: var(--text-primary);
    border: 1px solid var(--card-border);
    border-bottom-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
  }

  /* Bottom Controls Area */
  .bottom-panel {
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--card-border);
    padding: 0.75rem 1rem 1rem;
  }
  .bottom-container {
    max-width: 840px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  /* Suggestions Row */
  .suggestions-row {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.2rem;
  }
  .suggestions-row::-webkit-scrollbar { height: 4px; }
  .suggestions-row::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 2px; }
  .suggestion-pill {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid var(--card-border);
    color: var(--text-secondary);
    padding: 0.45rem 0.9rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .suggestion-pill:hover {
    background: rgba(249, 115, 22, 0.15);
    color: var(--accent);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  /* Form & Input Bar */
  form {
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }
  .input-wrapper {
    position: relative;
    flex: 1;
  }
  input {
    width: 100%;
    padding: 0.85rem 1.1rem;
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    color: #fff;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: var(--text-secondary); }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
  }
  button.send-btn {
    padding: 0.85rem 1.25rem;
    border: none;
    border-radius: 24px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(249, 115, 22, 0.4);
  }

  /* --- A2UI Component Enhancements --- */
  .a2card {
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 1.1rem;
    background: var(--card-bg);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    max-width: 100%;
    color: var(--text-primary);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #fff; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.825rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--card-border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; margin-top: 0.4rem; border: 1px solid var(--card-border); }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon"><span class="material-symbols-outlined">fitness_center</span></div>
    <div class="brand-title">Workout Coach</div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    <span>Online • AI Agent</span>
  </div>
</header>

<div id="log">
  <div class="welcome-card">
    <div class="icon-wrapper"><span class="material-symbols-outlined">fitness_center</span></div>
    <h2>Welcome to Workout Coach</h2>
    <p>Ask for workout routines, exercise form guides, 1-Rep Max calculations, or log your completed sets.</p>
  </div>
</div>

<div class="bottom-panel">
  <div class="bottom-container">
    <div id="suggestions" class="suggestions-row">
      <button type="button" class="suggestion-pill">What chest exercises should I do today?</button>
      <button type="button" class="suggestion-pill">Calculate my 1RM for 200 lbs x 5 reps</button>
      <button type="button" class="suggestion-pill">Log my bench press workout: 3 sets of 8 reps at 185 lbs</button>
    </div>
    <form id="form">
      <div class="input-wrapper">
        <input id="input" placeholder="Ask Workout Coach anything..." autocomplete="off" autofocus>
      </div>
      <button type="submit" class="send-btn">
        <span>Send</span>
        <span class="material-symbols-outlined" style="font-size: 1rem; color: #fff;">send</span>
      </button>
    </form>
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar");
  const avatarIcon = el("span", "material-symbols-outlined", who === "agent" ? "fitness_center" : "person");
  avatar.appendChild(avatarIcon);
  
  const bContainer = el("div", "bubble-container");
  const b = el("div", "bubble");
  
  bContainer.appendChild(b);
  m.appendChild(avatar);
  m.appendChild(bContainer);
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

document.querySelectorAll(".suggestion-pill").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.textContent;
    form.dispatchEvent(new Event("submit"));
  });
});
</script>
</body>
</html>
